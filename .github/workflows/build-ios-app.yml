name: Build Vertex iOS App

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-app/**"
      - ".github/workflows/build-ios-app.yml"

permissions:
  contents: read

jobs:
  ios:
    name: iOS Simulator Build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: npm install

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Inspect iOS project
        run: |
          find ios/App -maxdepth 2 -type d -print
          find ios/App -maxdepth 2 -type f -print | head -100

      - name: Build iOS app without signing
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Package simulator app
        run: |
          mkdir -p ios-output
          APP_PATH=$(find ios/build/Build/Products -type d -name "App.app" | head -1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ios-output/Vertex-Systems-AI-iOS-Simulator.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Vertex-Systems-AI-iOS-Simulator
          path: mobile-app/ios-output/Vertex-Systems-AI-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30
