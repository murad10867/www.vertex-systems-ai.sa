<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07101c">
  <title>تجربة Vertex AI بدون تسجيل دخول</title>
  <link rel="icon" type="image/png" href="img/logo3.png">
  <link rel="stylesheet" href="api-demo.css?v=20261013-guest-trial">
  <link rel="stylesheet" href="ai-video.css?v=20261015-1">
  <link rel="stylesheet" href="ai-learning.css?v=20261015-1">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-actions">
        <div id="trialStatus" class="trial-status" role="status" aria-live="polite">جارٍ تجهيز تجربتك...</div>
      </div>

      <a class="brand" href="index.html" aria-label="الرئيسية — Vertex AI" dir="ltr">
        <div class="brand-copy">
          <strong>Vertex AI</strong>
          <span>Powered by Vertex Systems AI</span>
        </div>
        <div class="brand-mark">V</div>
      </a>
    </header>

    <main class="chat-shell">
      <section id="welcome" class="welcome">
        <div class="core-wrap" aria-hidden="true">
          <div class="core-glow"></div>
          <div class="core">V</div>
        </div>

        <div class="welcome-label" dir="ltr">VERTEX INTELLIGENCE</div>
        <h1>وش تبغى تسأل <span dir="ltr">Vertex AI</span>؟</h1>
        <p>جرب الذكاء الاصطناعي بدون تسجيل دخول لمدة شهر.<br>30 يومًا من أول زيارة لهذا المتصفح، حتى 30 رسالة يوميًا.</p>

        <div class="suggestions">
          <button type="button" data-prompt="اكتب لي فكرة مشروع تقني جديدة"><span>💡</span> فكرة مشروع</button>
          <button type="button" data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة"><span>🧠</span> اشرح لي</button>
          <button type="button" data-prompt="ساعدني أكتب كود JavaScript بسيط"><span>💻</span> برمجة</button>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>
    </main>

    <div class="composer-area">
      <div class="composer">
        <textarea id="promptInput" rows="1" placeholder="اكتب رسالتك إلى Vertex AI..." maxlength="5000" disabled></textarea>
        <button id="sendBtn" class="send-btn" type="button" aria-label="إرسال" disabled>↑</button>
      </div>
      <div class="composer-note">Enter للإرسال • Shift + Enter لسطر جديد</div>
      <p id="trialNotice" class="trial-notice" role="status" aria-live="polite"></p>
      <a id="trialLogin" class="trial-login hidden" href="login.html">سجّل الدخول للاستمرار</a>
    </div>
  </div>

  <script src="ai-learning.js?v=20261015-1"></script>
  <script src="ai-video.js?v=20261015-learning"></script>
  <script src="api-demo.js?v=20261015-learning-2"></script>
    <script src="site-analytics.js?v=20260905-3"></script>
</body>
</html>
